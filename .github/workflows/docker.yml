name: docker
# ghcr.io/unseenet/bots (Dockerfile, docs "In Docker"): published for release tags
# only - never on every merge - through the shared workflow (unseenet/unseenet#571);
# a pull request that changes the image only builds and tests it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", "docker/**", "compose.yaml", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: unseenet/.github/.github/workflows/docker-image.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: ghcr.io/unseenet/bots
      test: |
        set -eux
        docker volume create ci
        docker run --rm -v ci:/data "$TEST_IMAGE" && exit 1 || test $? -eq 64     # example config written
        docker run --rm -v ci:/data "$TEST_IMAGE" new-key /data/.config/unseenet-bots/news.key | grep "ed25519:"
        docker run --rm -v ci:/data "$TEST_IMAGE" list | grep "^news "
        test "$(docker run --rm -v ci:/data "$TEST_IMAGE" sh -c 'id -u')" = 10001   # not root
        docker run --rm "$TEST_IMAGE" sh -c "tor --version"
