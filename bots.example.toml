# Copy to bots.toml and fill in the groups and keys.
#
# Each bot posts with its own key, which the channel's owner makes a poster
# (command palette: Make poster). Make one with:
#   unseenet-bots new-key ~/.config/unseenet-bots/news.key

[defaults]
state_file = "~/.local/state/unseenet-bots/state.json"
# nodes = ["xyz.onion"]        # default: Unseenet's list of known nodes
# ripen_to = 4                 # `unseenet-bots ripen`: the keys' level (UN-RFC 0025); default
                               # UNSEENET_RIPEN_TO, else 3. 4 takes two to three weeks of one
                               # core, then every post costs about a quarter of the postage

[bots.news]
source = "wikipedia-news"       # one post per story in Wikipedia's "In the news"
group = "alt.news.wikipedia@<owner fingerprint>"
from_name = "Wikipedia news (bot)"
key_file = "~/.config/unseenet-bots/news.key"
pictures = "check"              # the story's picture, only if Commons says PD, CC0, CC BY or CC BY-SA
max_per_run = 5
options = { lang = "en" }

[bots.news.profile]       # the public profile, with the bot mark (draft text)
about = "Headlines from Wikipedia's *In the news*, each with a link to the article."
not_affiliated_with = "Wikipedia"
lang = "en"
links = { web = "https://en.wikipedia.org/wiki/Portal:Current_events" }
# picture = "~/.config/unseenet-bots/news.webp"   # 128 px WebP, no metadata
# picture_alt = "..."

[bots.onthisday]
source = "wikipedia-onthisday"  # one post a day
group = "alt.history.onthisday@<owner fingerprint>"
from_name = "On this day (bot)"
key_file = "~/.config/unseenet-bots/onthisday.key"
options = { lang = "en", count = 6 }

[bots.onthisday.profile]       # the public profile, with the bot mark (draft text)
about = "What happened on this day in history, from Wikipedia - one post a day."
not_affiliated_with = "Wikipedia"
lang = "en"
links = { web = "https://en.wikipedia.org/wiki/Wikipedia:On_this_day/Today" }
# picture = "~/.config/unseenet-bots/onthisday.webp"   # 128 px WebP, no metadata
# picture_alt = "..."

[bots.globalvoices]
source = "globalvoices"         # whole stories, CC BY 3.0
group = "alt.news.globalvoices@<owner fingerprint>"
from_name = "Global Voices (bot)"
key_file = "~/.config/unseenet-bots/globalvoices.key"
max_per_run = 3

[bots.globalvoices.profile]       # the public profile, with the bot mark (draft text)
about = "Stories from Global Voices: citizen media and voices from around the world."
not_affiliated_with = "Global Voices"
lang = "en"
links = { web = "https://globalvoices.org/" }
# picture = "~/.config/unseenet-bots/globalvoices.webp"   # 128 px WebP, no metadata
# picture_alt = "..."

[bots.theconversation]
source = "theconversation"      # opening paragraphs + link, CC BY-ND 4.0
group = "alt.news.theconversation@<owner fingerprint>"
from_name = "The Conversation (bot)"
key_file = "~/.config/unseenet-bots/theconversation.key"
max_per_run = 2
max_per_day = 8                 # extracts, not the whole feed
options = { paragraphs = 3 }

[bots.theconversation.profile]       # the public profile, with the bot mark (draft text)
about = "Articles from The Conversation, written by researchers and academics."
not_affiliated_with = "The Conversation"
lang = "en"
links = { web = "https://theconversation.com/" }
# picture = "~/.config/unseenet-bots/theconversation.webp"   # 128 px WebP, no metadata
# picture_alt = "..."

[bots.eff]
source = "eff"                  # whole posts, CC BY 4.0
group = "alt.privacy.eff@<owner fingerprint>"
from_name = "EFF Deeplinks (bot)"
key_file = "~/.config/unseenet-bots/eff.key"
max_per_run = 3
max_age_hours = 96              # EFF posts a few times a week

[bots.eff.profile]       # the public profile, with the bot mark (draft text)
about = "News from the Electronic Frontier Foundation on privacy and digital rights."
not_affiliated_with = "the EFF"
lang = "en"
links = { web = "https://www.eff.org/deeplinks" }
# picture = "~/.config/unseenet-bots/eff.webp"   # 128 px WebP, no metadata
# picture_alt = "..."

[bots.nasa]
source = "nasa-iotd"            # NASA Image of the Day, not copyrighted
group = "alt.space.nasa@<owner fingerprint>"
from_name = "NASA Image of the Day (bot)"
key_file = "~/.config/unseenet-bots/nasa.key"
pictures = "yes"                # NASA's own pictures are not copyrighted
max_per_run = 2
max_age_hours = 72

[bots.nasa.profile]       # the public profile, with the bot mark (draft text)
about = "NASA's Image of the Day, with its caption."
not_affiliated_with = "NASA"
lang = "en"
links = { web = "https://www.nasa.gov/image-of-the-day/" }
# picture = "~/.config/unseenet-bots/nasa.webp"   # 128 px WebP, no metadata
# picture_alt = "..."

[bots.un]
source = "un-news"              # the summary and a link; tell the UN you carry it
group = "alt.news.un@<owner fingerprint>"
from_name = "UN News (bot)"
key_file = "~/.config/unseenet-bots/un.key"
pictures = "no"                 # UN Photo needs written permission for the web
max_per_run = 5
# options = { url = "https://news.un.org/feed/subscribe/en/news/topic/climate-change/feed/rss.xml" }

[bots.un.profile]       # the public profile, with the bot mark (draft text)
about = "Stories from UN News, the United Nations' news service: a short summary of each, with a link to the whole story."
not_affiliated_with = "the United Nations"
lang = "en"
links = { web = "https://news.un.org/en/" }

[bots.amnesty]
source = "amnesty"              # whole news items, CC BY-NC-ND 4.0, no pictures
group = "alt.news.amnesty@<owner fingerprint>"
from_name = "Amnesty International (bot)"
key_file = "~/.config/unseenet-bots/amnesty.key"
max_per_run = 3

[bots.amnesty.profile]
about = "News from Amnesty International on human rights around the world."
not_affiliated_with = "Amnesty International"
lang = "en"
links = { web = "https://www.amnesty.org/en/latest/" }

[bots.hrw]
source = "hrw"                  # whole news items, CC BY-NC-ND 4.0, no pictures
group = "alt.news.hrw@<owner fingerprint>"
from_name = "Human Rights Watch (bot)"
key_file = "~/.config/unseenet-bots/hrw.key"
max_per_run = 3
max_per_day = 8

[bots.hrw.profile]
about = "News from Human Rights Watch: investigations and reports on human rights abuses."
not_affiliated_with = "Human Rights Watch"
lang = "en"
links = { web = "https://www.hrw.org/news" }

[bots.mongabay]
source = "mongabay"             # the opening and a link
group = "alt.news.mongabay@<owner fingerprint>"
from_name = "Mongabay (bot)"
key_file = "~/.config/unseenet-bots/mongabay.key"
max_per_run = 2
max_per_day = 6

[bots.mongabay.profile]
about = "Conservation and environmental news from Mongabay: the opening of each article, with a link to the rest."
not_affiliated_with = "Mongabay"
lang = "en"
links = { web = "https://news.mongabay.com/" }
